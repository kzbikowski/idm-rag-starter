# Tylko Qdrant. Ollama działa NATYWNIE (w Dockerze na Macu nie ma dostępu do GPU/Metal).
# Stała nazwa projektu → wolumen idm-rag-starter_qdrant_data niezależnie od nazwy katalogu.
name: idm-rag-starter
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: idm-qdrant
    ports:
      - "6333:6333" # REST API + dashboard: http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:

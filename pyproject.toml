[project]
name = "idm-rag-starter"
version = "0.1.0"
description = "Starter RAG dla kursu Inżynieria dużych modeli językowych (WEiTI PW)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "rich>=15.0.0",
]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Długie napisy (prompty, komunikaty) zostawiamy w jednej linii; kod formatuje `ruff format`.
# UP047: zostawiamy TypeVar zamiast składni `def f[T: ...]` (czytelniejsze dla początkujących).
ignore = ["E501", "UP047"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
